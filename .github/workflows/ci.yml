name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: floodrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/floodrelay_test
      REQUIRE_DB: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tools/ortools-baseline/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/ortools-baseline/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Python pytest
        run: pytest tools/ortools-baseline/tests

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations up
        run: npm --workspace=@floodrelay/api run migrate

      - name: Test migrations down (rollback)
        run: npm --workspace=@floodrelay/api run migrate:down

      - name: Re-apply migrations up for integration tests
        run: npm --workspace=@floodrelay/api run migrate

      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check
