name: CI

on:
  push:
    branches: [main, feature/openapi-spec]
  pull_request:
    branches: [main, feature/openapi-spec]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: floodrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/floodrelay_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations up
        run: npm --workspace=@floodrelay/api run migrate

      - name: Test migrations down (rollback)
        run: npm --workspace=@floodrelay/api run migrate:down

      - name: Re-apply migrations up for integration tests
        run: npm --workspace=@floodrelay/api run migrate

      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check
